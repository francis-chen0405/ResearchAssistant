name: CI

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c desktop/constraints.txt -e "./backend[dev]"

      - name: Verify isolated wheel and editable installs outside the checkout
        run: python scripts/verify_distribution.py --constraints desktop/constraints.txt

      - name: Check repository root and dependency boundaries
        run: python scripts/check_repository_boundaries.py

      - name: PDF worker deadline regressions with coverage
        run: python -m pytest tests/test_pdf_worker_deadline.py --cov --cov-config=tests/pyproject.toml --cov-report=

      - name: Run tests with branch coverage
        run: python -m pytest tests --cov --cov-config=tests/pyproject.toml --cov-report=term-missing

  quality:
    name: Ruff lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c desktop/constraints.txt -e "./backend[dev]"

      - name: Run Ruff lint
        run: ruff check --config tests/pyproject.toml .

      - name: Check Ruff formatting
        run: ruff format --config tests/pyproject.toml --check .

  evaluation:
    name: Offline adversarial evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c desktop/constraints.txt -e "./backend[dev]"

      - name: Run deterministic offline evaluation
        run: |
          python evaluations/run_evaluations.py
          python -m evaluations.source_discovery

  frontend:
    name: Frontend lint, types, export and offline smokes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RESEARCHASSISTANT_DESKTOP: "1"
      NEXT_PUBLIC_RESEARCH_API_URL: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - name: Install backend development environment
        run: python -m pip install -c desktop/constraints.txt -e "./backend[dev]"
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Check generated frontend API contracts
        run: python frontend/scripts/generate_api_contracts.py --check
      - name: Test frontend API contracts
        run: python -m pytest tests/test_frontend_api_contracts.py
      - name: Hook recovery regressions
        run: node --test frontend/scripts/hook-regressions.test.cjs
      - name: Frontend ESLint
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm exec tsc --noEmit
      - name: Build static desktop export
        working-directory: frontend
        run: pnpm exec next build --webpack
      - name: Install locked acquisition package for shared Playwright runtime
        run: npm ci --prefix desktop/acquisition --ignore-scripts --no-audit --no-fund
      - name: Install locked Playwright Chromium
        run: node desktop/acquisition/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run offline frontend and API smokes
        run: pnpm --dir frontend smoke:offline
