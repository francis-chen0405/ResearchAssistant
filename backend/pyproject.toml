[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "researchassistant"
version = "0.1.0"
description = "Local ResearchAssistant desktop application for source-backed research on a claim."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "httpcore>=1.0.9,<1.1",
    "markdown-it-py>=3.0,<4.0",
    "pydantic>=2.0,<3.0",
    "pypdf>=5.0,<6.0",
    "reportlab>=4.4.9,<5.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
researchassistant = "researchassistant.runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "_build" = "_build"}
py-modules = ["cli", "models", "store"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["researchassistant", "researchassistant.*", "agents", "agents.*", "providers", "providers.*", "frontend", "frontend.*"]
namespaces = true

[tool.setuptools.package-data]
researchassistant = ["prompts/*.md", "evidence/fonts/*.ttf", "evidence/fonts/UNIFONT-LICENSE.txt", "evidence/fonts/README.md"]

[tool.setuptools.cmdclass]
build_py = "_build.build_distribution.BuildPy"

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

