[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
pythonpath = ["..", "../backend/src"]

[tool.coverage.run]
branch = true
source = ["backend/src/researchassistant"]
omit = [
    "tests/*",
    ".venv/*",
    "evaluations/output/*",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
src = [".", "backend/src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
