services:
  - type: web
    name: researchassistant-staging-web
    runtime: node
    plan: starter
    buildCommand: cd web && pnpm install --no-frozen-lockfile && pnpm build
    startCommand: cd web && pnpm start:render
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: HOSTED_API_HOSTPORT
        fromService:
          type: pserv
          name: researchassistant-staging-api
          property: hostport

  - type: pserv
    name: researchassistant-staging-api
    runtime: python
    plan: starter
    buildCommand: >-
      pip install "fastapi>=0.115,<1.0" "httpx>=0.27,<1.0"
      "markdown-it-py>=3.0,<4.0" "pydantic>=2.0,<3.0" "pypdf>=5.0,<6.0"
      "streamlit>=1.37,<2.0" "uvicorn>=0.30,<1.0"
    startCommand: uvicorn render_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: RA_DEPLOYMENT_ENV
        value: staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

  - type: worker
    name: researchassistant-staging-worker
    runtime: python
    plan: starter
    buildCommand: >-
      pip install "fastapi>=0.115,<1.0" "httpx>=0.27,<1.0"
      "markdown-it-py>=3.0,<4.0" "pydantic>=2.0,<3.0" "pypdf>=5.0,<6.0"
      "streamlit>=1.37,<2.0" "uvicorn>=0.30,<1.0"
    startCommand: python hosted_worker.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: RA_DEPLOYMENT_ENV
        value: staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HOSTED_JOB_LEASE_SECONDS
        value: "300"
      - key: HOSTED_PIPELINE_EXECUTOR
        value: canonical
      - key: HOSTED_CANONICAL_RUNNER
        value: hosted_canonical:run_canonical_hosted_pipeline
